name: Deploy to EC2

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production stack
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ledger-deploy-key"
          chmod 600 "$HOME/.ssh/ledger-deploy-key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          ssh -i "$HOME/.ssh/ledger-deploy-key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/Ledger-Entry-Automation

          previous_sha="$(git rev-parse main 2>/dev/null || true)"
          rollback_ready=false
          rollback_backend="ledger-entry-automation-backend:rollback"
          rollback_frontend="ledger-entry-automation-frontend:rollback"

          rollback() {
            status=$?
            echo "Deployment failed with exit code $status; attempting rollback."
            if [ -n "$previous_sha" ]; then
              git reset --hard "$previous_sha" || true
            fi
            if [ "$rollback_ready" = true ]; then
              sudo docker image tag "$rollback_backend" ledger-entry-automation-backend:latest || true
              sudo docker image tag "$rollback_frontend" ledger-entry-automation-frontend:latest || true
              sudo docker compose up -d --force-recreate backend frontend || true
            fi
            exit "$status"
          }
          trap rollback ERR

          if [ -x /usr/local/bin/ledger-db-backup.sh ]; then
            sudo /usr/local/bin/ledger-db-backup.sh
          fi

          if sudo docker image inspect ledger-entry-automation-backend:latest >/dev/null 2>&1 \
            && sudo docker image inspect ledger-entry-automation-frontend:latest >/dev/null 2>&1; then
            sudo docker image tag ledger-entry-automation-backend:latest "$rollback_backend"
            sudo docker image tag ledger-entry-automation-frontend:latest "$rollback_frontend"
            rollback_ready=true
          fi

          git fetch origin main
          git switch main
          git pull --ff-only origin main

          sudo docker compose up -d db redis
          sudo docker compose build backend frontend
          sudo docker compose up -d --force-recreate backend frontend
          sudo docker compose exec -T backend python manage.py migrate --noinput

          code="$(curl -sS -o /dev/null -w '%{http_code}' https://ledgerautomation.duckdns.org/)"
          test "$code" = "200"

          api_code="$(curl -sS -o /dev/null -w '%{http_code}' https://ledgerautomation.duckdns.org/api/)"
          test "$api_code" = "401"

          sudo docker compose ps
          REMOTE
