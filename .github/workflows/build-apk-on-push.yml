name: 🚀 Auto-Build APK on Code Push

on:
  push:
    branches:
      - main
      - samruddhi_contri
    paths:
      - 'mobile/lib/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'mobile/android/**'
      - 'mobile/assets/**'
      - '.github/workflows/build-apk-on-push.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK on Code Push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release-keystore.jks"
          } > mobile/android/key.properties

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://ledgerautomation.duckdns.org/api --dart-define=SENTRY_DSN=https://10c9de2439f439ae8a020750049ef8ca@o4512253878992896.ingest.de.sentry.io/4512253900161104

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inspection_Hub_latest
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
