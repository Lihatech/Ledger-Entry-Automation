name: 🚀 Auto-Build APK on Code Push

on:
  push:
    branches:
      - main
      - samruddhi_contri
    paths:
      - 'mobile/lib/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/android/**'

jobs:
  build:
    name: Build Release APK on Code Push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release-keystore.jks"
          } > mobile/android/key.properties

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://backend-production-343b4.up.railway.app/api

      - name: Copy APK to repo root
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk Inspection_Hub.apk

      - name: Commit updated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Inspection_Hub.apk
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): rebuild APK after code changes [skip ci]"
            git push origin HEAD
          fi

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inspection_Hub_latest
          path: Inspection_Hub.apk
          retention-days: 30
